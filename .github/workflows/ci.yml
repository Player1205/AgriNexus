name: AgriNexus Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # JOB 1: PYTHON BACKEND & C++ ENGINE AUTOMATED TESTS
  # =========================================================================
  backend-tests:
    name: 🐍 Python Backend & Safety Core Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: 📦 Install C++ Compiler & System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential python3-dev

      - name: 📦 Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: 🔍 Lint Codebase with Flake8
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warning level checks
          flake8 backend/app --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: 🧪 Run Pytest Automated Test Suite
        env:
          SARVAM_API_KEY: "ci_mock_key"
          GOOGLE_API_KEY: "ci_mock_key"
        run: |
          cd backend
          python -m pytest tests/ -v --durations=10

  # =========================================================================
  # JOB 2: SOLIDITY SMART CONTRACT COMPILATION & HARDHAT TESTS
  # =========================================================================
  contracts-tests:
    name: ⛓️ Solidity Smart Contract & Hardhat Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: contracts/package.json

      - name: 📦 Install Contract Dependencies
        working-directory: ./contracts
        run: npm ci

      - name: 🔨 Compile Solidity Contracts (Solc 0.8.20)
        working-directory: ./contracts
        run: npx hardhat compile

      - name: 🧪 Execute Hardhat Smart Contract Unit Tests
        working-directory: ./contracts
        run: npx hardhat test

  # =========================================================================
  # JOB 3: REACT FRONTEND PRODUCTION BUILD & ASSET VERIFICATION
  # =========================================================================
  frontend-build:
    name: ⚛️ React 18 & Vite Production Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: 📦 Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: 🚀 Build Optimized Production Bundle (Vite)
        working-directory: ./frontend
        run: npm run build

  # =========================================================================
  # JOB 4: DOCKER MULTI-STAGE CONTAINER BUILD VALIDATION
  # =========================================================================
  docker-validation:
    name: 🐳 Docker Multi-Stage Image Build Check
    runs-on: ubuntu-latest
    needs: [backend-tests, contracts-tests, frontend-build]

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Build Production Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: agrinexus:latest

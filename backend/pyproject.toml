[build-system]
requires = ["setuptools>=61.0", "pybind11>=2.11.1"]
build-backend = "setuptools.build_meta"

[project]
name = "agrinexus_backend"
version = "0.1.0"
description = "Backend API and Swarm for AgriNexus"
authors = [
    {name = "Principal Architect"}
]
dependencies = [
    "fastapi",
    "uvicorn",
    "langchain",
    "langchain-google-genai",
    "langgraph",
    "chromadb",
    "web3",
    "pydantic",
    "edge-tts",
    "python-multipart"
]
requires-python = ">=3.12"
